spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 15000
      data-source-properties:
        sslmode: verify-full
        sslrootcert: ${DB_SSL_ROOT_CERT}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: ${DB_MIGRATIONS_ENABLED:false}
    baseline-on-migrate: false
    clean-disabled: true
    locations: classpath:db/migration

logging:
  level:
    root: WARN
    com.lankaease: INFO

lankaease:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://lanka-ease.netlify.app,https://lanka-ease-home-refresh.metriconyx1.chatgpt.site,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}


  jwt:
    secret: ${JWT_SECRET}
  payment:
    mock-enabled: false
