# Spring Profile Activation Configuration for Production
spring.config.activate.on-profile=prod

# Database / Datasource Configuration (Supabase PostgreSQL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Migration Configuration
spring.flyway.enabled=${DB_MIGRATIONS_ENABLED:false}
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration

# Logging Configuration
logging.level.root=WARN
logging.level.com.lankaease=INFO

# CORS Configuration
lankaease.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://lanka-ease.netlify.app,https://lanka-ease-home-refresh.metriconyx1.chatgpt.site,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}


lankaease.jwt.secret=${JWT_SECRET}
lankaease.payment.mock-enabled=false

# Verified TLS and a small session-pooler connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.data-source-properties.sslmode=verify-full
spring.datasource.hikari.data-source-properties.sslrootcert=${DB_SSL_ROOT_CERT}
