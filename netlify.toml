[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_BASE_URL = "https://lanka-ease.onrender.com"
  VITE_ENABLE_DEMO = "false"

# These public build settings may be overridden in Netlify's environment.
# frontend/public/_redirects already supplies the React Router SPA fallback.
