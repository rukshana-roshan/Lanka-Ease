version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lankaease_postgres
    environment:
      POSTGRES_DB: lankaease
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lankaease"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lankaease_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://postgres:5432/lankaease
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgrespassword
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lankaease_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
