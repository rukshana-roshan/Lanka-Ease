services:
  - type: web
    name: lankaease-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_ROOT_CERT
        value: /etc/secrets/supabase-ca.crt
      - key: DB_MIGRATIONS_ENABLED
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://lanka-ease.netlify.app
